name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prepare SSH key
        env:
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_DEPLOY_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H 158.178.151.156 >> ~/.ssh/known_hosts

      - name: Upload build artifacts
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 'rm -rf /home/ubuntu/site-deploy && mkdir -p /home/ubuntu/site-deploy'
          scp -i ~/.ssh/oracle_deploy_key -r dist ubuntu@158.178.151.156:/home/ubuntu/site-deploy

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 '
            backup=/var/www/html-backup-$(date +%Y%m%d-%H%M%S) &&
            sudo cp -a /var/www/html "$backup" &&
            sudo find /var/www/html -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
            sudo cp -a /home/ubuntu/site-deploy/dist/. /var/www/html/ &&
            sudo find /var/www/html -type d -exec chmod 755 {} + &&
            sudo find /var/www/html -type f -exec chmod 644 {} + &&
            sudo systemctl reload nginx
          '
