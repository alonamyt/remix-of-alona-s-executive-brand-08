name: Deploy Avrora RAU Expo 2026

on:
  push:
    branches:
      - main
    paths:
      - avrora-rau-expo-2026/**
      - .github/workflows/deploy-avrora-rau-expo-2026.yml
  workflow_dispatch:

concurrency:
  group: deploy-avrora-rau-expo-2026
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avrora-rau-expo-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: avrora-rau-expo-2026/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          SITE_BASE: /avrora-rau-expo-2026/
        run: npm run build

      - name: Prepare SSH key
        env:
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_DEPLOY_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H 158.178.151.156 >> ~/.ssh/known_hosts

      - name: Upload build artifacts
        working-directory: .
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 'rm -rf /home/ubuntu/avrora-rau-expo-2026-deploy && mkdir -p /home/ubuntu/avrora-rau-expo-2026-deploy'
          scp -i ~/.ssh/oracle_deploy_key -r avrora-rau-expo-2026/dist ubuntu@158.178.151.156:/home/ubuntu/avrora-rau-expo-2026-deploy

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 '
            target=/var/www/avrora-rau-expo-2026 &&
            releases=/var/www/avrora-rau-expo-2026-releases &&
            release="$releases/release-$(date +%Y%m%d-%H%M%S)" &&
            backup=/var/www/avrora-rau-expo-2026-backup-$(date +%Y%m%d-%H%M%S) &&
            legacy="$releases/legacy-$(date +%Y%m%d-%H%M%S)" &&
            link_tmp=/var/www/.avrora-rau-expo-2026-link &&
            sudo mkdir -p "$releases" &&
            sudo mkdir -p "$release" &&
            sudo cp -a /home/ubuntu/avrora-rau-expo-2026-deploy/dist/. "$release"/ &&
            sudo find "$release" -type d -exec chmod 755 {} + &&
            sudo find "$release" -type f -exec chmod 644 {} + &&
            if [ -L "$target" ]; then
              current_target=$(readlink -f "$target") &&
              if [ -n "$current_target" ] && [ -d "$current_target" ]; then
                sudo cp -a "$current_target" "$backup";
              fi;
            elif [ -d "$target" ]; then
              sudo cp -a "$target" "$backup" &&
              sudo mv "$target" "$legacy";
            fi &&
            sudo ln -sfn "$release" "$link_tmp" &&
            sudo mv -Tf "$link_tmp" "$target" &&
            sudo find "$releases" -maxdepth 1 -mindepth 1 -type d -name "release-*" | sort | head -n -5 | xargs -r sudo rm -rf &&
            sudo mkdir -p "$target" &&
            sudo systemctl reload nginx &&
            curl -fsS http://127.0.0.1/avrora-rau-expo-2026/ >/dev/null
          '

      - name: Verify production URL
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://158.178.151.156/avrora-rau-expo-2026/) &&
            echo "attempt $attempt -> $code" &&
            test "$code" = "200"
            sleep 2
          done
