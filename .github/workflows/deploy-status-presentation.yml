name: Deploy Status Presentation

on:
  push:
    branches:
      - main
    paths:
      - sites/status-presentation/**
      - .github/workflows/deploy-status-presentation.yml
  workflow_dispatch:

concurrency:
  group: deploy-status-presentation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_DEPLOY_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H 158.178.151.156 >> ~/.ssh/known_hosts

      - name: Upload site files
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 'rm -rf /home/ubuntu/status-presentation-deploy && mkdir -p /home/ubuntu/status-presentation-deploy/site'
          scp -i ~/.ssh/oracle_deploy_key -r sites/status-presentation/. ubuntu@158.178.151.156:/home/ubuntu/status-presentation-deploy/site

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key ubuntu@158.178.151.156 '
            current=/var/www/status-presentation-current &&
            public=/var/www/html/status-presentation &&
            releases=/var/www/status-presentation-releases &&
            release="$releases/release-$(date +%Y%m%d-%H%M%S)" &&
            previous=$(readlink -f "$current" 2>/dev/null || true) &&
            link_tmp=/var/www/.status-presentation-current.tmp &&
            public_tmp=/var/www/html/.status-presentation-public.tmp &&
            sudo mkdir -p "$releases" &&
            sudo mkdir -p "$release" &&
            sudo cp -a /home/ubuntu/status-presentation-deploy/site/. "$release"/ &&
            sudo find "$release" -type d -exec chmod 755 {} + &&
            sudo find "$release" -type f -exec chmod 644 {} + &&
            test -f "$release/index.html" &&
            sudo ln -sfn "$release" "$link_tmp" &&
            sudo mv -Tf "$link_tmp" "$current" &&
            sudo ln -sfn "$release" "$public_tmp" &&
            sudo mv -Tf "$public_tmp" "$public" &&
            curl -fsS http://127.0.0.1/status-presentation/ >/dev/null || (
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                sudo ln -sfn "$previous" "$link_tmp" &&
                sudo mv -Tf "$link_tmp" "$current" &&
                sudo ln -sfn "$previous" "$public_tmp" &&
                sudo mv -Tf "$public_tmp" "$public";
              fi;
              exit 1;
            ) &&
            sudo find "$releases" -maxdepth 1 -mindepth 1 -type d -name "release-*" | sort | head -n -5 | xargs -r sudo rm -rf &&
            sudo systemctl reload nginx
          '
